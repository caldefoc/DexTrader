# Production-ish stack for the public demo.
#
#   cp .env.example .env      # then set DEMO_MODE=1 / NEXT_PUBLIC_DEMO_MODE=1
#   docker compose up -d --build
#
# Both services bind to loopback only; Caddy terminates TLS and proxies to them.

services:
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DEXTRADER_STATE_DIR: /data
      DEMO_MODE: "1"
    volumes:
      - dextrader-state:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-https://dextrader.caldefoc.com/api}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-1}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dextrader-state:
