name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_base_market test_token_volumes test_auto_trade_policy test_base_token_support

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Policy tests
        working-directory: .
        run: node --test scripts/test_auto_trade_policy.cjs scripts/test_base_token_support.cjs
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000

  no-personal-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if runtime state is tracked
        run: |
          if git ls-files | grep -E '(^|/)(trades\.json|deleted_corrupted_trades\.json|agents\.log|acct[^/]*\.json|nonce[^/]*\.json|baseblock\.json|tibbair_bal\.json|base_address_cache\.json)'; then
            echo "::error::Runtime/personal data files must not be tracked."
            exit 1
          fi
